<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Praca 1.0 Pro</title>
    <style>
        :root { 
            --primary: #2e7d32; 
            --accent: #ffa000; 
            --money: #2e7d32; 
            --danger: #c62828; 
            --dark: #333;
            /* Kolory jasne */
            --bg-body: #f4f4f4;
            --bg-card: #ffffff;
            --text-main: #333333;
            --text-dim: #555555;
            --border-color: #bbbbbb;
            --table-th: #f0f0f0;
            --table-sat: #fffde7;
            --input-bg: #ffffff;
        }

        /* Kolory ciemne */
        body.dark-mode {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-main: #e0e0e0;
            --text-dim: #b0b0b0;
            --border-color: #444444;
            --table-th: #2c2c2c;
            --table-sat: #2d2a10;
            --input-bg: #2a2a2a;
            --dark: #000;
        }
        
        body { 
            font-family: sans-serif; 
            margin: 0; 
            background: var(--bg-body); 
            color: var(--text-main);
            font-size: 14px; 
            padding-bottom: 40px; 
            padding-top: env(safe-area-inset-top, 60px); 
            transition: background 0.3s, color 0.3s;
        }

        .tabs { 
            display: flex; 
            background: var(--dark); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            overflow-x: auto; 
        }

        .tab { flex: 0 0 auto; padding: 12px 15px; text-align: center; color: white; opacity: 0.7; cursor: pointer; white-space: nowrap; font-size: 13px; }
        .tab.active { opacity: 1; border-bottom: 3px solid var(--accent); font-weight: bold; }
        
        .content { padding: 5px; }
        .card { background: var(--bg-card); padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 10px; border: 1px solid var(--border-color); }
        
        input, select { 
            width: 100%; padding: 10px; margin-top: 4px; 
            border: 1px solid var(--border-color); 
            background: var(--input-bg);
            color: var(--text-main);
            border-radius: 4px; font-size: 14px; box-sizing: border-box; 
        }

        .btn-add { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 6px; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .mode-selector { display: flex; gap: 5px; margin-bottom: 15px; }
        .mode-btn { flex: 1; padding: 10px; font-size: 12px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--table-th); color: var(--text-main); cursor: pointer; font-weight: bold; }
        .mode-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .btn-reset { width: 100%; background: var(--danger); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: bold; margin-top: 30px; margin-bottom: 50px; cursor: pointer; opacity: 0.8; }
        
        .month-section { margin-top: 10px; background: var(--bg-card); border: 1px solid var(--border-color); overflow-x: auto; margin-bottom: 5px; }
        table { width: 100%; border-collapse: collapse; min-width: 320px; }
        th, td { border: 1px solid var(--border-color); padding: 4px 2px; text-align: center; white-space: nowrap; font-size: 10px; }
        th { background: var(--table-th); }
        .sat-row { background-color: var(--table-sat) !important; }
        .filled-row { background-color: var(--bg-card); font-weight: bold; }
        .empty-row { color: #888; }
        
        .summary-box { background: var(--bg-card); padding: 10px; border: 2px solid var(--text-dim); border-radius: 8px; font-size: 11px; margin-top: 5px; margin-bottom: 30px; }
        .pula-card { background: var(--dark); color: white; border-radius: 8px; padding: 10px; margin-bottom: 15px; }
        .summary-header { font-weight: bold; border-bottom: 1px solid var(--border-color); margin-bottom: 5px; padding-bottom: 2px; text-transform: uppercase; }
        .summary-line { display: flex; justify-content: space-between; margin-bottom: 3px; border-bottom: 1px dashed var(--border-color); }
        
        .val { font-weight: bold; color: var(--primary); }
        .val-money { font-weight: bold; color: #4caf50; }
        .trash { color: var(--danger); font-weight: bold; font-size: 14px; cursor: pointer; padding: 0 5px; }
        .hidden { display: none; }
        
        h3 { margin: 20px 0 10px 0; color: var(--text-main); border-left: 4px solid var(--primary); padding-left: 10px; background: var(--table-th); padding-top: 5px; padding-bottom: 5px; }

        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; background: var(--bg-body); padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); }
        .settings-grid div { display: flex; flex-direction: column; }
        .settings-grid label { font-size: 10px; font-weight: bold; color: var(--text-dim); }
        .settings-grid input { padding: 5px; margin-top: 2px; font-size: 12px; }
    </style>
</head>
<body>

<div class="tabs">
    <div id="t1" class="tab active" onclick="showTab(1)">Wprowadź</div>
    <div id="t2" class="tab" onclick="showTab(2)">Miesiąc</div>
    <div id="t3" class="tab" onclick="showTab(3)">Roczne</div>
    <div id="t4" class="tab" onclick="showTab(4)">Finanse</div>
    <div id="t5" class="tab" onclick="showTab(5)">Ustawienia</div>
</div>

<div id="content1" class="content">
    <div class="card">
        <div class="mode-selector">
            <button class="mode-btn active" id="btnSingle" onclick="setMode('single')">Jeden dzień</button>
            <button class="mode-btn" id="btnRange" onclick="setMode('range')">Zakres dni</button>
        </div>
        <div id="divSingle"><label>Data:</label><input type="date" id="workDate"></div>
        <div id="divRange" class="hidden"><label>Od:</label><input type="date" id="dateStart"><label>Do:</label><input type="date" id="dateEnd"></div>
        
        <label style="margin-top: 10px; display: block;">Rodzaj:</label>
        <select id="dayType" onchange="toggleFields()">
            <option value="work">Praca</option>
            <option value="urlop_wyp">Urlop wypoczynkowy</option>
            <option value="urlop_zad">Urlop na żądanie</option>
            <option value="sila_wyzsza">Siła wyższa</option>
            <option value="inne">Inne (własny tekst)</option>
        </select>
        
        <div id="workFields">
            <div style="display:flex; gap:5px; margin-top:10px;">
                <div style="flex:1"><small>Start:</small><input type="time" id="sT" value="08:00"></div>
                <div style="flex:1"><small>Koniec:</small><input type="time" id="eT" value="16:00"></div>
            </div>
        </div>
        <div id="silaFields" class="hidden"><label>Godziny:</label><input type="number" id="sH" value="2"></div>
        <div id="inneFields" class="hidden"><label>Twój tekst:</label><input type="text" id="inneTxt" placeholder="Np. Delegacja"></div>
        
        <button class="btn-add" onclick="save()">ZAPISZ DANE</button>
    </div>
</div>

<div id="content2" class="content hidden"> <div id="historyMonth"></div> </div>
<div id="content3" class="content hidden"> <div id="historyYear"></div> </div>
<div id="content4" class="content hidden"> <div id="historyFinance"></div> </div>
<div id="content5" class="content hidden"> 
    <div id="settingsArea"></div>
    <button class="btn-add" onclick="saveSettings()">ZAPISZ STAWKI</button>
</div>

<script>
    const DB_KEY = 'arkusz_pracy_2026_final_v6';
    const SETTINGS_KEY = 'arkusz_pracy_2026_settings';
    const THEME_KEY = 'arkusz_pracy_theme';
    const year = 2026;
    let currentMode = 'single';
    
    const months = ["Styczeń", "Luty", "Marzec", "Kwiecień", "Maj", "Czerwiec", "Lipiec", "Sierpień", "Wrzesień", "Październik", "Listopad", "Grudzień"];

    let defaultSettings = months.map(() => ({
        rateBN: 30, rateB50: 45, rateOver: 45, rateSat: 60, premia: 500
    }));

    let db = JSON.parse(localStorage.getItem(DB_KEY)) || [];
    let settings = JSON.parse(localStorage.getItem(SETTINGS_KEY)) || defaultSettings;

    // Inicjalizacja motywu
    if (localStorage.getItem(THEME_KEY) === 'dark' || (!localStorage.getItem(THEME_KEY) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.body.classList.add('dark-mode');
    }

    document.getElementById('workDate').valueAsDate = new Date();
    document.getElementById('dateStart').valueAsDate = new Date();
    document.getElementById('dateEnd').valueAsDate = new Date();

    function toggleDarkMode() {
        const isDark = document.body.classList.toggle('dark-mode');
        localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
        renderSettings();
    }

    function setMode(m) { 
        currentMode = m; 
        document.getElementById('btnSingle').classList.toggle('active', m==='single'); 
        document.getElementById('btnRange').classList.toggle('active', m==='range'); 
        document.getElementById('divSingle').classList.toggle('hidden', m!=='single'); 
        document.getElementById('divRange').classList.toggle('hidden', m!=='range'); 
    }
    
    function toggleFields() { 
        const t = document.getElementById('dayType').value; 
        document.getElementById('workFields').classList.toggle('hidden', t!=='work'); 
        document.getElementById('silaFields').classList.toggle('hidden', t!=='sila_wyzsza'); 
        document.getElementById('inneFields').classList.toggle('hidden', t!=='inne');
    }

    function processEntry(dateStr) {
        if(!dateStr) return;
        const dObj = new Date(dateStr);
        if (dObj.getDay() === 0) return;
        db = db.filter(e => e.date !== dateStr);
        const type = document.getElementById('dayType').value;
        const inneVal = document.getElementById('inneTxt').value;
        
        let e = { date: dateStr, type, customTxt: inneVal, mIdx: dObj.getMonth(), dateF: dObj.toLocaleDateString('pl-PL').slice(0,5), dayN: dObj.toLocaleDateString('pl-PL', {weekday: 'short'}), isSat: dObj.getDay() === 6, start: "-", end: "-", reg: 0, over: 0, bN: 0, b50: 0, sila: 0, satH: 0 };
        
        if(type === 'work') {
            const s = document.getElementById('sT').value.split(':');
            const et = document.getElementById('eT').value.split(':');
            let diff = (parseInt(et[0])*60+parseInt(et[1]) - (parseInt(s[0])*60+parseInt(s[1])))/60;
            if(diff < 0) diff += 24;
            e.start = document.getElementById('sT').value; e.end = document.getElementById('eT').value;
            e.reg = diff > 8 ? 8 : diff; e.over = diff > 8 ? diff - 8 : 0;
            if(e.over > 0) { e.bN = 0.25; e.b50 = 0.25; }
            if(e.isSat) e.satH = diff;
        } else if(type === 'sila_wyzsza') { e.sila = parseFloat(document.getElementById('sH').value) || 0; }
        
        db.push(e);
    }

    function save() {
        if (currentMode === 'single') processEntry(document.getElementById('workDate').value);
        else {
            let start = new Date(document.getElementById('dateStart').value);
            let end = new Date(document.getElementById('dateEnd').value);
            for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) processEntry(d.toISOString().split('T')[0]);
        }
        localStorage.setItem(DB_KEY, JSON.stringify(db)); alert("Zapisano!"); showTab(2);
    }

    function calculateStats(entries, mIdx) {
        let s = { over:0, overNetto:0, sila:0, sat:0, uw:0, uz:0, bn:0, b50:0, workDays:0, satCount:0 };
        entries.forEach(e => {
            if(e.type === 'work') { if(e.isSat) s.satCount++; else s.workDays++; }
            s.over += e.over;
            if(e.over > 0.5) s.overNetto += (e.over - 0.5);
            s.sila += e.sila; s.sat += e.satH;
            s.bn += e.bN; s.b50 += e.b50;
            if(e.type==='urlop_wyp') s.uw++; if(e.type==='urlop_zad') s.uz++;
        });
        const mSet = settings[mIdx] || defaultSettings[0];
        s.payBN = s.bn * mSet.rateBN;
        s.payB50 = s.b50 * mSet.rateB50;
        s.payOver = s.overNetto * mSet.rateOver;
        s.paySat = s.sat * mSet.rateSat;
        s.premia = mSet.premia;
        s.total = s.payBN + s.payB50 + s.payOver + s.paySat + s.premia;
        return s;
    }

    function renderSettings() {
        const area = document.getElementById('settingsArea');
        const isDark = document.body.classList.contains('dark-mode');
        area.innerHTML = `
            <h3>Praca 1.0 - Konfiguracja</h3>
            <div class="card">
                <label>Tryb wizualny:</label>
                <button class="mode-btn" onclick="toggleDarkMode()" style="margin-top:10px; width:100%">
                    Przełącz na tryb ${isDark ? 'JASNY ☀️' : 'CIEMNY 🌙'}
                </button>
            </div>
        `;
        months.forEach((m, idx) => {
            area.innerHTML += `
                <div class="card">
                    <strong style="display:block; margin-bottom:10px; border-bottom:1px solid var(--border-color);">${m} 2026</strong>
                    <div class="settings-grid">
                        <div><label>Przerwa N (zł/h)</label><input type="number" id="bn_${idx}" value="${settings[idx].rateBN}"></div>
                        <div><label>Przerwa 50% (zł/h)</label><input type="number" id="b50_${idx}" value="${settings[idx].rateB50}"></div>
                        <div><label>Nadgodziny (zł/h)</label><input type="number" id="ov_${idx}" value="${settings[idx].rateOver}"></div>
                        <div><label>Soboty (zł/h)</label><input type="number" id="sat_${idx}" value="${settings[idx].rateSat}"></div>
                        <div style="grid-column: span 2;"><label>Premia (zł)</label><input type="number" id="pre_${idx}" value="${settings[idx].premia}"></div>
                    </div>
                </div>`;
        });
    }

    function saveSettings() {
        months.forEach((_, idx) => {
            settings[idx] = {
                rateBN: parseFloat(document.getElementById(`bn_${idx}`).value) || 0,
                rateB50: parseFloat(document.getElementById(`b50_${idx}`).value) || 0,
                rateOver: parseFloat(document.getElementById(`ov_${idx}`).value) || 0,
                rateSat: parseFloat(document.getElementById(`sat_${idx}`).value) || 0,
                premia: parseFloat(document.getElementById(`pre_${idx}`).value) || 0
            };
        });
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        alert("Stawki zostały zapisane!");
    }

    function getSummaryHTML(title, s) {
        return `
            <div class="summary-box">
                <div class="summary-header">Podsumowanie: ${title}</div>
                <div class="summary-line"><span>Suma nadgodzin:</span><span class="val">${s.over.toFixed(1)} h</span></div>
                <div class="summary-line"><span>Nadgodziny netto:</span><span class="val" style="color:var(--danger)">${s.overNetto.toFixed(2)} h</span></div>
                <div class="summary-line"><span>Suma z sobót:</span><span class="val">${s.sat.toFixed(1)} h</span></div>
                <div class="summary-line"><span>Siła wyższa:</span><span class="val">${s.sila} h</span></div>
                <div class="summary-line"><span>Przerwy (N/50%):</span><span class="val">${s.bn.toFixed(2)}h / ${s.b50.toFixed(2)}h</span></div>
                <div class="summary-line"><span>Urlop W/Ż:</span><span class="val">${s.uw} / ${s.uz} dni</span></div>
                <div class="summary-line" style="border-top:1px solid var(--border-color); margin-top:5px; padding-top:2px;"><span>Dni robocze (PN-PT):</span><span class="val">${s.workDays}</span></div>
                <div class="summary-line"><span>Licznik sobót:</span><span class="val">${s.satCount}</span></div>
            </div>`;
    }

    function renderMonth() {
        const area = document.getElementById('historyMonth'); area.innerHTML = "";
        months.forEach((mName, mIdx) => {
            let monthEntries = db.filter(e => e.mIdx === mIdx);
            let s = calculateStats(monthEntries, mIdx);
            let daysInMonth = new Date(year, mIdx + 1, 0).getDate();
            let html = `<h3>${mName} 2026</h3><div class="month-section"><table><tr><th>Data</th><th>Dn</th><th>St</th><th>Ko</th><th>8h</th><th>Nd</th><th>P1</th><th>P2</th><th></th></tr>`;
            for (let d = 1; d <= daysInMonth; d++) {
                const dStr = `${year}-${(mIdx+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
                const entry = monthEntries.find(e => e.date === dStr);
                const dObj = new Date(year, mIdx, d);
                if (entry) {
                    let label = entry.type.toUpperCase();
                    if(entry.type === 'inne') label = entry.customTxt || "INNE";
                    html += `<tr class="${entry.isSat?'sat-row':'filled-row'}"><td>${entry.dateF}</td><td>${entry.dayN}</td>${entry.type==='work'?`<td>${entry.start}</td><td>${entry.end}</td><td>${entry.reg.toFixed(1)}</td><td style="color:var(--danger)">${entry.over.toFixed(1)}</td><td>${entry.bN>0?'15m':'-'}</td><td>${entry.b50>0?'15m':'-'}</td>`:`<td colspan="6">${label}</td>`}<td onclick="del('${entry.date}')" class="trash">×</td></tr>`;
                } else {
                    html += `<tr class="${dObj.getDay()===6?'sat-row':'empty-row'}"><td>${d.toString().padStart(2,'0')}.${(mIdx+1).toString().padStart(2,'0')}</td><td>${dObj.toLocaleDateString('pl-PL', {weekday: 'short'})}</td><td colspan="6">-</td><td></td></tr>`;
                }
            }
            area.innerHTML += html + `</table></div>` + getSummaryHTML(mName, s);
        });
    }

    function renderYear() {
        const area = document.getElementById('historyYear');
        let totalStats = calculateStats(db, 0); 
        area.innerHTML = `<div class="pula-card"><div class="summary-header">PULA 2026:</div><div class="summary-line"><span>Urlop Wyp.:</span><span style="color:#81c784">${32-totalStats.uw-totalStats.uz} / 32</span></div><div class="summary-line"><span>Urlop Żąd.:</span><span style="color:#81c784">${4-totalStats.uz} / 4</span></div><div class="summary-line"><span>Siła wyższa:</span><span style="color:#81c784">${16-totalStats.sila} / 16h</span></div></div>`;
        months.forEach((mName, idx) => { area.innerHTML += getSummaryHTML(mName, calculateStats(db.filter(e => e.mIdx === idx), idx)); });
        area.innerHTML += `<button class="btn-reset" onclick="hardReset()">RESET DANYCH</button>`;
    }

    function renderFinance() {
        const area = document.getElementById('historyFinance'); area.innerHTML = "<h3>Analiza Finansowa 2026</h3>";
        months.forEach((mName, idx) => {
            let s = calculateStats(db.filter(e => e.mIdx === idx), idx);
            let mSet = settings[idx];
            area.innerHTML += `
                <div class="summary-box">
                    <div class="summary-header">Miesiąc: ${mName}</div>
                    <div class="summary-line"><span>Przerwa 15m (${mSet.rateBN}zł/h):</span><span>${s.payBN.toFixed(2)} zł</span></div>
                    <div class="summary-line"><span>Przerwa 50% (${mSet.rateB50}zł/h):</span><span>${s.payB50.toFixed(2)} zł</span></div>
                    <div class="summary-line"><span>Nadgodziny netto (${mSet.rateOver}zł/h):</span><span>${s.payOver.toFixed(2)} zł</span></div>
                    <div class="summary-line"><span>Soboty (${mSet.rateSat}zł/h):</span><span>${s.paySat.toFixed(2)} zł</span></div>
                    <div class="summary-line"><span>Premia miesięczna:</span><span>${s.premia.toFixed(2)} zł</span></div>
                    <div class="summary-line" style="border-top:1px solid var(--border-color); margin-top:5px; padding-top:5px; font-weight:bold;">
                        <span>DO WYPŁATY:</span><span class="val-money">${s.total.toFixed(2)} zł</span>
                    </div>
                </div>`;
        });
    }

    function hardReset() { if(confirm("Czyścić wszystko?")) { localStorage.clear(); location.reload(); } }
    function del(date) { if(confirm('Usunąć?')) { db = db.filter(e => e.date !== date); localStorage.setItem(DB_KEY, JSON.stringify(db)); renderMonth(); } }
    
    function showTab(n) {
        document.querySelectorAll('.content').forEach(c => c.classList.add('hidden'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('content'+n).classList.remove('hidden');
        document.getElementById('t'+n).classList.add('active');
        if(n===2) renderMonth();
        if(n===3) renderYear();
        if(n===4) renderFinance();
        if(n===5) renderSettings();
    }
</script>
</body>
</html>
